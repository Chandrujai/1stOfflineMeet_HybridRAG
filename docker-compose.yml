services:
  hybrid-rag:
    build: .
    container_name: streamlit_hybrid_rag
    restart: unless-stopped
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - chroma_store:/app/chroma_db_store
      - uploaded_files:/app/uploaded_files

        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.offlinemeet.rule=Host(`offlinemeet.tech`)"
          - "traefik.http.routers.offlinemeet.entrypoints=websecure"
          - "traefik.http.routers.offlinemeet.tls=true"
          - "traefik.http.routers.offlinemeet.tls.certresolver=letsencrypt"
          - "traefik.http.services.offlinemeet.loadbalancer.server.port=8502"
          - "traefik.docker.network=1stofflinemeet_hybridrag_default"

volumes:
  chroma_store:
  uploaded_files: